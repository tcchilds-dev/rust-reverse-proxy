[server]
addr = "0.0.0.0:8080"
request_timeout_secs = 30
max_concurrent_requests = 1000
# max_response_body_bytes = default: 100 * 1024 * 1024 (100MiB)

[tls]
cert_path = "/etc/proxy/cert.pem"
key_path = "/etc/proxy/key.pem"
addr = "0.0.0.0:8443"

[logging]
level = "debug"

[rate_limiting]
requests_per_second = 100
burst_size = 200

[health_checks]
path = "/health"
interval_secs = 10
timeout_secs = 3

[caching]
max_capacity = 500
default_ttl = 60

# Order routes from most-specific to least-specific in order for the
# path_prefix matching to work correctly.

[[routes]]
path_prefix = "/a"
backends = [
  "http://localhost:3001",
  "http://localhost:3002",
  "http://localhost:3003",
]

[[routes]]
path_prefix = "/b"
backends = ["http://localhost:3005"]
